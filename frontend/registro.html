      <div class="bloque focus">
        <input type="texto" placeholder="Nombre" style="margin-bottom: 10px" />
        <input
        type="texto"
          placeholder="Apellido"
          style="margin-bottom: 10px"
        />
      </div>

      <div class="bloque focus">
        <label for="date">Fecha de Nacimiento </label>
        <input type="text" name="fecha" placeholder="dd/mm/aaaa" 
         pattern="/d{2}/\d{2}/\d{4}" required>

      <div class="genero">
        <label><input type="radio" name="genero" /> Mujer</label>
        <label><input type="radio" name="genero" /> Hombre</label>
      </div>

      <div class="bloque focus">
        <input
          type="email"
          placeholder="Número de celular o correo electrónico"
          style="margin-bottom: 10px"
        />
        <input
          type="password"
          placeholder="Contraseña "
          style="margin-bottom: 10px"
        />
      </div>
      <p class="texto-informativo">
        Es posible que las personas que usan nuestro servicio hayan subido tu
        información de contacto . <a href="#">Más información.</a>
      </p>

      <p class="condiciones">
        Al hacer clic en "Registrarte", aceptas nuestras
        <a href="#">Condiciones</a>, la <a href="#">Política de privacidad</a> y
        la <a href="#">Política de cookies</a>.
      </p>

      <button class="registro-btn"><a href="usuario.html">Registrarte</a></button>
